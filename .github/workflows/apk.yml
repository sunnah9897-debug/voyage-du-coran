# Compile automatiquement l'APK Android à chaque envoi de fichiers sur GitHub.
# L'APK se télécharge ensuite dans l'onglet « Releases » du dépôt.
# Le projet peut être envoyé soit fichier par fichier, soit en un seul zip nommé voyage-du-coran-projet.zip.
name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      # Si le projet a été envoyé en un seul fichier zip, on le décompresse ici.
      - name: Décompresser le projet (si envoyé en zip)
        run: |
          if [ -f voyage-du-coran-projet.zip ]; then
            unzip -q -o voyage-du-coran-projet.zip -d .
            echo "Projet décompressé."
          else
            echo "Pas de zip : les fichiers sont déjà dans le dépôt."
          fi

      - name: Installer Node.js (pour les tests du jeu)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Tester la logique et le contenu du jeu
        run: node --test tests/engine.test.js tests/content.test.js

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compiler l'APK
        working-directory: android
        run: gradle assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace

      - name: Nommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "voyage-du-coran-${{ github.run_number }}.apk"

      - name: Garder l'APK (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: voyage-du-coran-apk
          path: voyage-du-coran-*.apk

      - name: Publier l'APK (onglet Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Le Voyage du Coran — APK n°${{ github.run_number }}
          body: |
            Version de test. Télécharge le fichier .apk ci-dessous sur ton téléphone Android, puis ouvre-le pour l'installer.
            Contenu en brouillon : à faire vérifier par un enseignant avant diffusion.
          files: voyage-du-coran-*.apk
